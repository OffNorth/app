<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bot de trading — Marchés</title>
  <meta name="description" content="Suivi du bot de paper trading (or et Nasdaq 100) : portefeuilles, positions, historique et stratégies.">
  <meta name="theme-color" content="#0b0f14">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="stylesheet" href="/assets/styles.css">
  <link rel="stylesheet" href="/assets/bot.css">
  <script src="/assets/theme.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js" async></script>
</head>
<body class="bot-page">
  <header class="topbar">
    <div class="topbar-row">
      <div class="brand">
        <h1>Bot de trading</h1>
        <p id="subtitle" class="subtitle">Chargement…</p>
      </div>
      <div class="top-actions">
        <button id="refresh" class="icon-btn" type="button" aria-label="Rafraîchir">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
        </button>
      </div>
    </div>
    <div class="seg seg-wide b-market" id="market-seg" role="group" aria-label="Marché"></div>
  </header>

  <main id="main">
    <div id="view" class="view"><div class="b-spin"></div></div>
    <footer class="footer">
      <p><strong>Simulation uniquement : aucun argent réel. Information, pas un conseil financier.</strong></p>
      <p class="consent-small"><a href="/" id="home-link">← Retour à Marchés</a></p>
    </footer>
  </main>

  <nav class="tabbar b-tabbar" aria-label="Sections du bot">
    <button type="button" data-tab="portfolio" aria-current="page">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" d="M3 10h18M9 6V4.5h6V6"/></svg>
      <span>Portefeuille</span>
    </button>
    <button type="button" data-tab="feed">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M6 16V11a6 6 0 1 1 12 0v5l1.5 2h-15zM10 20.5a2 2 0 0 0 4 0"/></svg>
      <span>Activité</span>
    </button>
    <button type="button" data-tab="history">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 7.5V12l3 2"/></svg>
      <span>Historique</span>
    </button>
    <button type="button" data-tab="catalog">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M5 4h10a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2zM17 8h2v12H7"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M8.5 8.5h5M8.5 12h5"/></svg>
      <span>Stratégies</span>
    </button>
  </nav>

  <div class="b-sheet-bg" id="sheet-bg" hidden></div>
  <div class="b-sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Détail de la stratégie"><div class="b-grab"></div><div class="b-sheet-inner" id="sheet-body"></div></div>

  <script src="/assets/bot.js"></script>
</body>
</html>
